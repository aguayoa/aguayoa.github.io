name: 🐛 Bug
description: Something isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 🔴 Critical
        - 🟠 Major
        - 🟡 Minor
