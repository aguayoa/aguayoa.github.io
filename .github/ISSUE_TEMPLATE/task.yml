name: ✅ Task
description: A unit of work to track
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔥 High
        - ⚡ Medium
        - 🌱 Low
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: YYYY-MM-DD
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ]
        - [ ]
