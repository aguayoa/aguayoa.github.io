<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aguayoa</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <header class="site-header">
      <!-- Change the name in OWNER below to personalize the greeting -->
      <p class="hello" id="hello"></p>
      <h1>Home</h1>
      <p class="today" id="today"></p>
    </header>

    <section class="home-grid" aria-label="Sections">
      <a class="card home-tile" href="calendar/">
        <div class="card-top">
          <span class="card-icon" aria-hidden="true">🌀</span>
          <span class="tag">VR ready</span>
        </div>
        <h2>The Time Chamber</h2>
        <p>Step inside: a giant fiscal-year calendar on the wall, and your projects kept in a floating 1960s tool bag.</p>
        <span class="tag" id="project-count" style="align-self:flex-start"></span>
        <span class="card-cta">Enter the room →</span>
      </a>
    </section>

    <footer>aguayoa.github.io · <a href="projects/">Plain project list</a></footer>
  </main>

  <script src="assets/projects.js"></script>
  <script>
    const OWNER = "aguayoa";

    const h = new Date().getHours();
    const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    document.getElementById("hello").textContent = `${part}, ${OWNER}`;
    document.getElementById("today").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric", year: "numeric",
    });

    const active = PROJECTS.filter((p) => p.status === "active").length;
    document.getElementById("project-count").textContent =
      `${PROJECTS.length} projects · ${active} active`;
  </script>
</body>
</html>
