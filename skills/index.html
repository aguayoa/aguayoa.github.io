<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gravity Room</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #07090c; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .a-canvas { touch-action: none; }
    .hud {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px; z-index: 10;
      width: 320px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto;
      background: rgba(16, 19, 23, 0.9); backdrop-filter: blur(8px);
      border: 1px solid #2a3038; border-radius: 14px; color: #e9ecef; font-size: 0.88rem;
      --acct-bg: #171b21; --acct-text: #e9ecef; --acct-border: #2a3038; --acct-muted: #8e959c;
    }
    .hud > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .hud > summary::-webkit-details-marker { display: none; }
    .hud > summary h1 { font-size: 1rem; margin: 0; }
    .hud > summary span { color: #8e959c; font-size: 0.8rem; }
    .hud[open] > summary span::after { content: "Hide"; }
    .hud:not([open]) > summary span::after { content: "Menu"; }
    .body { padding: 0 16px 16px; }
    .acct-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .acct-line a { color: #6ea8fe; font-weight: 600; text-decoration: none; }
    .label { display: block; font-weight: 700; color: #8e959c; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
    .card { background: #171b21; border: 1px solid #2a3038; border-radius: 12px; padding: 12px; }
    .sk-name { width: 100%; box-sizing: border-box; font: inherit; font-size: 1.05rem; font-weight: 800; color: #f1f3f5; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 4px 6px; margin-left: -6px; }
    .sk-name:hover, .sk-note:hover { border-color: #2a3038; }
    .sk-name:focus, .sk-note:focus, .add input:focus { outline: 2px solid #ff453a; outline-offset: 1px; }
    .sk-row { display: grid; grid-template-columns: 64px 1fr 42px; align-items: center; gap: 8px; margin-top: 8px; color: #8e959c; }
    .sk-row input { width: 100%; accent-color: #4cd964; }
    .sk-row output { text-align: right; color: #e9ecef; font-variant-numeric: tabular-nums; }
    .sk-gravity { margin: 6px 0 0; color: #8e959c; }
    .sk-gravity strong { color: #ff453a; font-family: ui-monospace, Consolas, monospace; font-size: 1.05rem; }
    .sk-note { width: 100%; box-sizing: border-box; margin-top: 8px; font: inherit; color: #e9ecef; background: #101317; border: 1px solid #2a3038; border-radius: 8px; padding: 8px 10px; }
    .sk-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    select, .plain, .mini, .add button {
      font: inherit; font-weight: 600; cursor: pointer; color: #e9ecef;
      background: #101317; border: 1px solid #2a3038; border-radius: 999px; padding: 6px 11px;
    }
    #chasing { list-style: none; margin: 0; padding: 0; }
    #chasing li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #222830; }
    #chasing li:last-child { border-bottom: none; }
    #chasing i { flex: none; width: 10px; height: 10px; border-radius: 50%; }
    #chasing span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini { padding: 4px 9px; border-radius: 8px; }
    .mini[data-train] { color: #ff6b61; }
    .add { display: flex; gap: 6px; margin-top: 10px; }
    .add input { flex: 1; min-width: 0; font: inherit; color: #e9ecef; background: #101317; border: 1px solid #2a3038; border-radius: 8px; padding: 8px 10px; }
    .tip { color: #8e959c; line-height: 1.45; margin: 12px 0 0; }
    #mastered { color: #4cd964; }
    .warp { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle, #fff 30%, #ffe3c2); }
    .warp[hidden] { display: none; }
    .warp-in { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle, #fff 30%, #ffe3c2); pointer-events: none; animation: fadeout .9s ease-out forwards; }
    @keyframes fadeout { to { opacity: 0; } }
    @media (pointer: coarse) { .plain, .mini, select, .add button { padding: 9px 13px; } }
  </style>
</head>
<body>
  <div class="warp-in" aria-hidden="true"></div>
  <details class="hud" open>
    <summary><h1>Gravity Room</h1><span></span></summary>
    <div class="body">
      <div class="acct-line"><a href="../calendar/?view=first">← Time Chamber</a><div id="account"></div></div>

      <span class="label">Now training</span>
      <div class="card" id="current-skill"></div>

      <span class="label">Skills I'm chasing</span>
      <ul id="chasing"></ul>
      <form class="add" id="add-skill" autocomplete="off">
        <input id="add-name" placeholder="A skill you want…" aria-label="New skill">
        <select id="add-area" aria-label="Area"></select>
        <button type="submit">Add</button>
      </form>

      <span class="label">Mastered</span>
      <div id="mastered"></div>

      <p class="tip">The higher your progress, the higher the gravity. Tap <strong>TRAIN ▶</strong> on the board or ▶ here to switch skills. Walk with WASD or the thumb joystick; the exit is behind you.</p>
      <p class="tip" id="mode-note"></p>
    </div>
  </details>
  <div class="warp" id="warp" hidden></div>

  <a-scene
    background="color: #07090c"
    renderer="antialias: true; colorManagement: true"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable; far: 40"
    vr-mode-ui="enabled: true">
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.55"></a-entity>
    <a-entity light="type: directional; color: #fff6e8; intensity: 0.35" position="2 8 4"></a-entity>
    <a-entity id="red-light" light="type: point; color: #ff2a2a; intensity: 1; distance: 16; decay: 1.2" position="0 3.3 0"></a-entity>

    <a-entity gravity-room></a-entity>
    <a-entity id="console" class="clickable" skill-console position="0 1.55 1.05" rotation="-14 0 0"></a-entity>
    <a-entity id="board" class="clickable" skill-board position="-5.53 3.4 -6.59" rotation="0 40 0"></a-entity>

    <a-entity id="rig" room-controls>
      <a-entity id="cam" camera="userHeight: 0"></a-entity>
      <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .clickable; far: 40; lineColor: #ff453a"></a-entity>
      <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .clickable; far: 40; lineColor: #ff453a"></a-entity>
    </a-entity>
  </a-scene>

  <script src="../assets/config.js"></script>
  <script src="../assets/sample.js"></script>
  <script src="../assets/areas.js"></script>
  <script src="../assets/store.js"></script>
  <script src="../assets/account.js"></script>
  <script src="../assets/touch-controls.js"></script>
  <script src="room.js"></script>
</body>
</html>
