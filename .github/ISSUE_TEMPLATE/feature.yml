name: 💡 Feature
description: Propose a new feature or idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔥 High
        - ⚡ Medium
        - 🌱 Low
